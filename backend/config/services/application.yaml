# yaml-language-server: $schema=../../packages/adapters/vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
  api_key: '%env(API_KEY)%'

services:
  _defaults:
    autowire: false
    autoconfigure: false

  CuriosityConference\Application\UseCase\User\CreateHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\User\Persister'
  CuriosityConference\Application\UseCase\User\DeleteHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomResultsByUserIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdDeleter'
      - '@mercure.hub.default'
  CuriosityConference\Application\UseCase\User\DetailsGetHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
  CuriosityConference\Application\UseCase\User\DeleteQuizRoomParticipantHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomUpdater'
      - '@mercure.hub.default'

  CuriosityConference\Application\UseCase\TriviaQuiz\CreateHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\Persister'
  CuriosityConference\Application\UseCase\TriviaQuiz\TriviaPersistHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\Loader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\ByIdDeleter'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\ByNameLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\Persister'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuestion\ByQuizDeleter'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuestion\Persister'
  CuriosityConference\Application\UseCase\TriviaQuiz\ListHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\Loader'
  CuriosityConference\Application\UseCase\TriviaQuiz\DeleteHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\ByIdDeleter'
  CuriosityConference\Application\UseCase\TriviaQuiz\StartHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomUpdater'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuestion\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\HighscorePersister'
      - '@mercure.hub.default'
  CuriosityConference\Application\UseCase\TriviaQuiz\DeleteRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdDeleter'
      - '@mercure.hub.default'
  CuriosityConference\Application\UseCase\TriviaQuiz\ListRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomLoader'
  CuriosityConference\Application\UseCase\TriviaQuiz\ListHighscoreByRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\HighscoreCollectionByQuizRoomLoader'
  CuriosityConference\Application\UseCase\TriviaQuiz\ActiveRoomLoadHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByUserIdLoader'
  CuriosityConference\Application\UseCase\TriviaQuiz\ListHighscoreByAllRoomsHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\HighscoreByAllRoomsLoader'

  CuriosityConference\Application\UseCase\TriviaQuestion\CreateHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuestion\Persister'
  CuriosityConference\Application\UseCase\TriviaQuiz\CreateRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomPersister'
  CuriosityConference\Application\UseCase\TriviaQuiz\JoinRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomParticipantPersister'
  CuriosityConference\Application\UseCase\TriviaQuiz\HighscoreUpdateHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaAnswer\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\HighscoreLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\HighscoreUpdater'
  CuriosityConference\Application\UseCase\TriviaQuiz\ContinueOrFinishHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuestion\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomUpdater'
      - '@mercure.hub.default'
      - '@api.v1.quiz.logger'
  CuriosityConference\Application\UseCase\TriviaQuiz\RevealCorrectAnswerHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdLoader'
      - '@mercure.hub.default'
  CuriosityConference\Application\UseCase\TriviaQuiz\CloseRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomUpdater'
      - '@mercure.hub.default'

  CuriosityConference\Application\UseCase\TriviaQuestion\ByQuizLoadHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\TriviaQuestion\ByIdLoader'
      - '@api.v1.quiz.logger'
  CuriosityConference\Application\UseCase\TriviaQuestion\DeleteHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuestion\ByIdDeleter'
  CuriosityConference\Application\UseCase\TriviaQuestion\ByRoomLoadHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\TriviaQuiz\RoomByIdLoader'
      - '@api.v1.quiz.logger'

  CuriosityConference\Application\UseCase\QuestionnaireQuestion\PersistHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\QuestionnaireQuestion\QuestionResetter'
      - '@CuriosityConference\Adapters\Outbound\QuestionnaireAnswer\Persister'

  CuriosityConference\Application\UseCase\Security\ApiKeyValidator:
    arguments:
      - '%api_key%'
      - '@api.v1.authentication.logger'