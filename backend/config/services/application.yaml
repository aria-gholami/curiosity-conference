# yaml-language-server: $schema=../../packages/adapters/vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
  api_key: '%env(API_KEY)%'

services:
  _defaults:
    autowire: false
    autoconfigure: false

  CuriosityConference\Application\UseCase\User\CreateHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\User\Persister'
  CuriosityConference\Application\UseCase\User\DeleteHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByUserIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdDeleter'
      - '@mercure.hub.default'
  CuriosityConference\Application\UseCase\User\DetailsGetHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
  CuriosityConference\Application\UseCase\User\DeleteQuizRoomParticipantHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomUpdater'
      - '@mercure.hub.default'

  CuriosityConference\Application\UseCase\Quiz\CreateHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\Persister'
  CuriosityConference\Application\UseCase\Quiz\ListHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\Loader'
  CuriosityConference\Application\UseCase\Quiz\DeleteHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\ByIdDeleter'
  CuriosityConference\Application\UseCase\Quiz\StartHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomUpdater'
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Question\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Quiz\HighscorePersister'
  CuriosityConference\Application\UseCase\Quiz\DeleteRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByIdDeleter'
      - '@mercure.hub.default'
  CuriosityConference\Application\UseCase\Quiz\ListRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomLoader'
  CuriosityConference\Application\UseCase\Quiz\ListHighscoreByRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Quiz\HighscoreCollectionByQuizRoomLoader'
  CuriosityConference\Application\UseCase\Quiz\ActiveRoomLoadHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByUserIdLoader'

  CuriosityConference\Application\UseCase\Question\CreateHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Question\Persister'
  CuriosityConference\Application\UseCase\Quiz\CreateRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomPersister'
  CuriosityConference\Application\UseCase\Quiz\JoinRoomHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomParticipantPersister'
  CuriosityConference\Application\UseCase\Quiz\HighscoreUpdateHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Answer\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\User\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Quiz\HighscoreLoader'
      - '@CuriosityConference\Adapters\Outbound\Quiz\HighscoreUpdater'
  CuriosityConference\Application\UseCase\Quiz\ContinueOrFinishHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Question\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomUpdater'
      - '@api.v1.quiz.logger'

  CuriosityConference\Application\UseCase\Question\ByQuizLoadHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\ByIdLoader'
      - '@CuriosityConference\Adapters\Outbound\Question\ByIdLoader'
      - '@api.v1.quiz.logger'
  CuriosityConference\Application\UseCase\Question\DeleteHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Question\ByIdDeleter'
  CuriosityConference\Application\UseCase\Question\ByRoomLoadHandler:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Quiz\RoomByIdLoader'
      - '@api.v1.quiz.logger'

  CuriosityConference\Application\UseCase\Security\ApiKeyValidator:
    arguments:
      - '%api_key%'
      - '@api.v1.authentication.logger'