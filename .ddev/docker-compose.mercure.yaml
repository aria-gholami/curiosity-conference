services:
  mercure:
    container_name: "ddev-${DDEV_SITENAME}-mercure"
    image: dunglas/mercure
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    expose:
      - "80"
    environment:
      SERVER_NAME: :80
      VIRTUAL_HOST: mercure.${DDEV_HOSTNAME}
      HTTP_EXPOSE: 8090:80
      HTTPS_EXPOSE: 8091:80
      MERCURE_PUBLISHER_JWT_KEY: "oCvmrslUyLvPI6e5GNdMG0U4ahdbfA88"
      MERCURE_SUBSCRIBER_JWT_KEY: "oCvmrslUyLvPI6e5GNdMG0U4ahdbfA88"
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins https://curiosity-conference.ddev.site
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  mercure_data:
  mercure_config: