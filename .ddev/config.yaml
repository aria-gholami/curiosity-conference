name: curiosity-conference
type: php
docroot: backend/public
php_version: "8.5"
nodejs_version: "26"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: mariadb
    version: "11.8"
use_dns_when_possible: true
composer_version: "2"
web_environment: []
corepack_enable: false
web_extra_exposed_ports:
    - name: vite
      container_port: 5173
      http_port: 5172
      https_port: 5173
web_extra_daemons:
    - name: vite
      command: "npm run dev"
      directory: /var/www/html/frontend
hooks:
    post-start:
        - exec: cd frontend && npm install
        - exec: cd frontend && cp .env.dev .env.local
        - exec: supervisorctl restart webextradaemons:vite
        - exec: cd backend && cp .env.dev .env.local
        - exec: cd cms && cp .env.dev .env.local
        - exec: cd backend && composer install --no-interaction --optimize-autoloader
        - exec: cd backend && php bin/console doctrine:database:drop --force && php bin/console doctrine:database:drop --env=test --force
        - exec: cd backend && php bin/console doctrine:database:create && php bin/console doctrine:database:create --env=test
        - exec: cd backend && php bin/console doctrine:schema:create && php bin/console doctrine:schema:create --env=test
        - exec: cd backend && php bin/console doctrine:fixtures:load -n
        - exec: cd cms && php bin/console doctrine:database:drop --if-exists --force && php bin/console doctrine:database:create --if-not-exists && php bin/console sulu:build dev -n
        - exec: cd testing-tools && wget -O phpunit https://phar.phpunit.de/phpunit-13.phar && chmod +x phpunit
        - exec: cd testing-tools && wget -O phpcs https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/v3.95.18/php-cs-fixer.phar && chmod +x phpcs
        - exec: cd testing-tools && wget -O psalm https://github.com/vimeo/psalm/releases/download/6.16.1/psalm.phar && chmod +x psalm
        - exec: cd testing-tools && wget -O infection https://github.com/infection/infection/releases/download/0.35.0/infection.phar && chmod +x infection