parameters:
  log_level: '%env(int:LOG_LEVEL)%'
  admin_email: '%env(ADMIN_EMAIL)%'

services:
  _defaults:
    autowire: false
    autoconfigure: false

  CuriosityConference\Adapters\Inbound\Controller\API\V1\User\CreateController:
    arguments:
      - '@CuriosityConference\Application\UseCase\User\CreateHandler'
      - '@api.v1.user.logger'
    tags:
      - { name: 'controller.service_arguments' }
  CuriosityConference\Adapters\Inbound\Controller\API\V1\User\DeleteController:
    arguments:
      - '@CuriosityConference\Application\UseCase\User\DeleteHandler'
      - '@api.v1.user.logger'
    tags:
      - { name: 'controller.service_arguments' }

  CuriosityConference\Adapters\Inbound\Controller\API\V1\User\LoginController:
    arguments:
      - '@CuriosityConference\Application\UseCase\User\LoginHandler'
      - '@api.v1.user.logger'
    tags:
      - { name: 'controller.service_arguments' }
  CuriosityConference\Adapters\Inbound\Controller\API\V1\User\PasswordResetMailSendController:
    arguments:
      - '@CuriosityConference\Application\UseCase\User\PasswordResetMailSendHandler'
      - '@api.v1.user.logger'
    tags:
      - { name: 'controller.service_arguments' }
  CuriosityConference\Adapters\Inbound\Controller\API\V1\User\PasswordResetTokenVerifyController:
    arguments:
      - '@CuriosityConference\Application\UseCase\User\PasswordResetTokenVerifyHandler'
      - '@api.v1.user.logger'
    tags:
      - { name: 'controller.service_arguments' }

  CuriosityConference\Adapters\Inbound\Controller\API\V1\Quiz\CreateController:
    arguments:
      - '@CuriosityConference\Application\UseCase\Quiz\CreateHandler'
      - '@api.v1.quiz.logger'
    tags:
      - { name: 'controller.service_arguments' }
  CuriosityConference\Adapters\Inbound\Controller\API\V1\Quiz\ListController:
    arguments:
      - '@CuriosityConference\Application\UseCase\Quiz\ListHandler'
      - '@api.v1.quiz.logger'
    tags:
      - { name: 'controller.service_arguments' }
  CuriosityConference\Adapters\Inbound\Controller\API\V1\Quiz\DeleteController:
    arguments:
      - '@CuriosityConference\Application\UseCase\Quiz\DeleteHandler'
      - '@api.v1.quiz.logger'
    tags:
      - { name: 'controller.service_arguments' }

  CuriosityConference\Adapters\Inbound\Controller\API\V1\Question\CreateController:
    arguments:
      - '@CuriosityConference\Application\UseCase\Question\CreateHandler'
      - '@api.v1.quiz.logger'
    tags:
      - { name: 'controller.service_arguments' }
  CuriosityConference\Adapters\Inbound\Controller\API\V1\Question\ByQuizLoadController:
    arguments:
      - '@CuriosityConference\Application\UseCase\Question\ByQuizLoadHandler'
      - '@api.v1.quiz.logger'
    tags:
      - { name: 'controller.service_arguments' }
  CuriosityConference\Adapters\Inbound\Controller\API\V1\Question\DeleteController:
    arguments:
      - '@CuriosityConference\Application\UseCase\Question\DeleteHandler'
      - '@api.v1.quiz.logger'
    tags:
      - { name: 'controller.service_arguments' }

  CuriosityConference\Adapters\Outbound\User\ByEmailLoader:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\UserRepository'
      - '@api.v1.user.logger'

  CuriosityConference\Adapters\Outbound\User\Persister:
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@api.v1.user.logger'
  CuriosityConference\Adapters\Outbound\User\ByEmailDeleter:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\UserRepository'
      - '@api.v1.quiz.logger'
  CuriosityConference\Adapters\Outbound\User\ByIdLoader:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\UserRepository'
      - '@api.v1.quiz.logger'
  CuriosityConference\Adapters\Outbound\User\PasswordResetTokenPersister:
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@api.v1.user.logger'
  CuriosityConference\Adapters\Outbound\User\PasswordResetMailSender:
    arguments:
      - '@mailer.mailer'
      - '%admin_email%'
  CuriosityConference\Adapters\Outbound\User\PasswordResetTokenDeleter:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\PasswordResetRepository'
      - '@api.v1.user.logger'
  CuriosityConference\Adapters\Outbound\User\PasswordResetTokenLoader:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\PasswordResetRepository'
      - '@api.v1.user.logger'

  CuriosityConference\Adapters\Outbound\Quiz\Persister:
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@api.v1.quiz.logger'
  CuriosityConference\Adapters\Outbound\Quiz\Loader:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\QuizRepository'
      - '@api.v1.quiz.logger'
  CuriosityConference\Adapters\Outbound\Quiz\ByIdLoader:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\QuizRepository'
      - '@api.v1.quiz.logger'
  CuriosityConference\Adapters\Outbound\Quiz\ByIdDeleter:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\QuizRepository'
      - '@api.v1.quiz.logger'

  CuriosityConference\Adapters\Outbound\Question\ByIdLoader:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\QuestionRepository'
      - '@api.v1.quiz.logger'
  CuriosityConference\Adapters\Outbound\Question\Persister:
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@api.v1.user.logger'
  CuriosityConference\Adapters\Outbound\Question\ByIdDeleter:
    arguments:
      - '@CuriosityConference\Adapters\Outbound\Persistence\Repository\QuestionRepository'
      - '@api.v1.quiz.logger'

  CuriosityConference\Adapters\Outbound\Persistence\Repository\UserRepository:
    arguments:
      - '@doctrine'
    tags:
      - 'doctrine.repository_service'
  CuriosityConference\Adapters\Outbound\Persistence\Repository\PasswordResetRepository:
    arguments:
      - '@doctrine'
    tags:
      - 'doctrine.repository_service'
  CuriosityConference\Adapters\Outbound\Persistence\Repository\QuizRepository:
    arguments:
      - '@doctrine'
    tags:
      - 'doctrine.repository_service'
  CuriosityConference\Adapters\Outbound\Persistence\Repository\QuestionRepository:
    arguments:
      - '@doctrine'
    tags:
      - 'doctrine.repository_service'

  CuriosityConference\Adapters\Outbound\Security\Argon2idHasher: ~

  CuriosityConference\Adapters\Inbound\Security\ValidateApiKeySubscriber:
    arguments:
      - '@CuriosityConference\Application\UseCase\Security\ApiKeyValidator'
      - '@api.v1.authentication.logger'
    tags:
      - { name: kernel.event_subscriber }

  api.v1.user.logging-handler:
    class: Monolog\Handler\RotatingFileHandler
    arguments:
      - '%kernel.logs_dir%/user_%kernel.environment%.log'
      - 14
      - '%log_level%'
      - true
      - 436
  api.v1.user.logger:
    class: Monolog\Logger
    arguments:
      - 'user'
    calls:
      - [ pushHandler, [ '@api.v1.user.logging-handler' ] ]

  api.v1.quiz.logging-handler:
    class: Monolog\Handler\RotatingFileHandler
    arguments:
      - '%kernel.logs_dir%/quiz_%kernel.environment%.log'
      - 14
      - '%log_level%'
      - true
      - 436
  api.v1.quiz.logger:
    class: Monolog\Logger
    arguments:
      - 'quiz'
    calls:
      - [ pushHandler, [ '@api.v1.quiz.logging-handler' ] ]

  api.v1.authentication.logging-handler:
    class: Monolog\Handler\RotatingFileHandler
    arguments:
      - '%kernel.logs_dir%/authentication_%kernel.environment%.log'
      - 14
      - '%log_level%'
      - true
      - 436
  api.v1.authentication.logger:
    class: Monolog\Logger
    arguments:
      - 'authentication'
    calls:
      - [ pushHandler, [ '@api.v1.authentication.logging-handler' ] ]