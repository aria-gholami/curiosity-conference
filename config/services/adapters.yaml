      - '@api.v1.authentication.logger'
    tags:
      - { name: kernel.event_subscriber }

  api.v1.user.logging-handler:
    class: Monolog\Handler\RotatingFileHandler
    arguments:
      - '%kernel.logs_dir%/user_%kernel.environment%.log'
      - 14
      - '%log_level%'
      - true
      - 436
  api.v1.user.logger:
    class: Monolog\Logger
    arguments:
      - 'user'
    calls:
      - [ pushHandler, [ '@api.v1.user.logging-handler' ] ]

  api.v1.device.logging-handler:
